name: ths-daily-collect

on:
  schedule:
    # GitHub cron 使用 UTC；以下对应北京时间
    - cron: "30 0 * * *"   # 北京 08:30  早间补采/确认昨日数据
    - cron: "45 7 * * *"   # 北京 15:45  收盘后立即采集当日
    - cron: "0 10 * * *"   # 北京 18:00  兜底复核
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect THS fund flows
        run: |
          python3 --version
          python3 collect.py

      - name: Show result
        if: always()
        run: |
          echo "--- flows.jsonl tail ---"
          tail -n 8 flows.jsonl || true
          echo "--- runs.log tail ---"
          tail -n 5 runs.log || true
